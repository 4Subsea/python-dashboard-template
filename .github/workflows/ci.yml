name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # so you can run it by hand from the Actions tab

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Formatting first: it is the fastest check and the easiest to fix
      - name: black
        run: black --check --diff .

      # Importing data.py validates the results spreadsheet, so this fails
      # loudly if the workbook has shifted under us
      - name: Import the app
        run: python -c "import sys; sys.path.insert(0, 'src'); import app"

      - name: pytest
        run: pytest
