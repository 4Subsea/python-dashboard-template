name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # so you can run it by hand from the Actions tab

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Configure git auth for private design-system repo
        run: |
          git config --global url."https://x-access-token:${{ secrets.DESIGN_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Formatting first: it is the fastest check and the easiest to fix
      - name: black
        run: black --check --diff .

      - name: pytest
        run: pytest
