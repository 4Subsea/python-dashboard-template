# Tool configuration only - the app is run as a script, not installed as a package.
# Keeping the settings here means `black` and `pytest` behave identically whether
# they are run by you, by an editor, or by CI.

[tool.black]
line-length = 100
target-version = ["py312"]
# Notebooks are formatted by hand. Without this, whether black touches them
# depends on whether the jupyter extra happens to be installed, which makes CI
# behave differently from a developer machine.
extend-exclude = '''
/(
  \.ipynb_checkpoints
  | notebooks
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
